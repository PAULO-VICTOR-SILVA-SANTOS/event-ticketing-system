<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <base href="/admin/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - PV Technology</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('admin_theme') || 'light');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter+Tight:wght@400;500;600;700;800&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"
  />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>
  <div class="login-shell">
    <button class="theme-toggle-btn login-theme-toggle" id="theme-toggle-btn" data-theme-toggle type="button"></button>
    <div class="login-card">
      <div class="login-logo">
        <img class="pv-logo-img login-logo-img" src="assets/img/pv-logo.png" alt="PV Technology" />
        <div>
          <h1>PV Technology</h1>
          <span class="brand-tagline">Business Solution</span>
          <p>Painel administrativo do evento</p>
          <p class="brand-slogan">Impulsionando o futuro dos negocios atraves da tecnologia</p>
        </div>
      </div>

      <div class="form-error" id="login-error" hidden>
        <i class="ti ti-alert-triangle"></i>
        <span id="login-error-text">Usuario ou senha invalidos.</span>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" placeholder="Seu usuario" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit">
          <i class="ti ti-login-2"></i> Entrar
        </button>
      </form>
    </div>
  </div>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
