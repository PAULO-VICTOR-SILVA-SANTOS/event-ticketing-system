<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - PV Technology</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('admin_theme') || 'light');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter+Tight:wght@400;500;600;700;800&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"
  />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>
  <div class="login-shell">
    <button class="theme-toggle-btn login-theme-toggle" id="theme-toggle-btn" data-theme-toggle type="button"></button>
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark-wrap">
          <svg class="logo-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" stroke="url(#pvRingA)" stroke-width="1.4" stroke-dasharray="6 7"/><circle class="orbit-dot" cx="50" cy="2" r="3" fill="#a855f7"/><defs><linearGradient id="pvRingA" x1="0" y1="0" x2="100" y2="100"><stop offset="0%" stop-color="#0055ff" stop-opacity=".55"/><stop offset="100%" stop-color="#7b2fff" stop-opacity=".55"/></linearGradient></defs></svg>
          <svg class="logo-ring-2" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" stroke="url(#pvRingB)" stroke-width="1.2" stroke-dasharray="3 8"/><defs><linearGradient id="pvRingB" x1="0" y1="0" x2="100" y2="100"><stop offset="0%" stop-color="#7b2fff" stop-opacity=".45"/><stop offset="100%" stop-color="#0055ff" stop-opacity=".45"/></linearGradient></defs></svg>
          <div class="logo-mark"><span>PV</span></div>
        </div>
        <div>
          <h1>PV Technology</h1>
          <span class="brand-tagline">Business Solution</span>
          <p>Painel administrativo do evento</p>
          <p class="brand-slogan">Impulsionando o futuro dos negocios atraves da tecnologia</p>
        </div>
      </div>

      <div class="form-error" id="login-error" hidden>
        <i class="ti ti-alert-triangle"></i>
        <span id="login-error-text">Usuario ou senha invalidos.</span>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" placeholder="Seu usuario" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit">
          <i class="ti ti-login-2"></i> Entrar
        </button>
      </form>
    </div>
  </div>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
